<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cubic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="titlebar">
      <div class="brand"><span class="ic" id="brand-ic"></span><span id="brand-name">Cubic</span></div>
      <div class="win-btns">
        <button id="w-min" title="Minimizar" aria-label="Minimizar"></button>
        <button id="w-max" title="Maximizar" aria-label="Maximizar"></button>
        <button id="w-close" class="close" title="Cerrar" aria-label="Cerrar"></button>
      </div>
    </header>

    <aside class="sidebar">
      <nav id="nav"></nav>
      <div id="side-account"></div>
    </aside>

    <main id="view"></main>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
